name: CI
on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r EmotionML/requirements.txt

      - name: Lint & test
        run: |
          cd EmotionML
          pytest

  verify-train_user:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r EmotionML/requirements.txt

      - name: Smoke test train_user CLI
        run: |
          cd EmotionML
          python scripts/train_user.py --help

  deploy:
    needs: [test, verify-train_user]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Add real deployment steps here, it's just a test."